<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Northstar POS — Business Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!--Login/Sign-up Page-->
    <div id="loginView" class="login-wrap">
        <form id="loginForm" class="login-card">
            <div class="brand-mark">N</div>
            <p class="eyebrow">BUSINESS OPERATIONS</p>
            <h1>Welcome back</h1>
            <p class="muted">Sign in to manage your business.</p>
            <label>Username<input id="loginUser" autocomplete="username" required value="admin"></label>
            <label>Password<input id="loginPass" type="password" autocomplete="current-password" required></label>
            <button class="btn primary full">Sign in</button>
            <p id="loginError" class="error"></p>
            <div class="demo-note">First login: <b>admin</b> / <b>admin123</b></div>
        </form>
    </div>

    <div id="appView" class="app hidden">
        <aside class="sidebar" id="sidebar">
            <div class="brand"><span class="brand-mark">N</span><span><b>Northstar</b><small>Business
                        Suite</small></span></div>
            <div class="user-mini">
                <div class="avatar" id="userAvatar">A</div>
                <div><b id="userName">Administrator</b><small id="userRole">Owner</small></div>
            </div>
            <nav id="nav"></nav>
            <div class="sidebar-bottom"><button id="backupBtn" class="nav-link">⇩ <span>Backup &
                        restore</span></button><button id="logoutBtn" class="nav-link">↪ <span>Sign out</span></button>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <button id="menuBtn" class="icon-btn">☰</button>
                <div>
                    <p class="eyebrow" id="pageEyebrow">OVERVIEW</p>
                    <h2 id="pageTitle">Dashboard</h2>
                </div>
                <div class="top-actions"><span class="date-pill" id="todayLabel"></span><button class="icon-btn"
                        id="quickSaleBtn" title="New sale">＋</button></div>
            </header>
            <section id="content" class="content"></section>
        </main>
    </div>

    <div id="modalRoot"></div>
    <div id="toastRoot" class="toast-root"></div><input type="file" id="restoreFile" accept="application/json" hidden>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/sales.js"></script>
    <script src="js/expenses.js"></script>
    <script src="js/employees.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
